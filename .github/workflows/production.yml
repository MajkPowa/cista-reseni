name: Publish to cistareseni.cz
# Nahrává dist/ na hosting www.cistareseni.cz přes FTPS.
# Přístup: tajné hodnoty repozitáře FTP_USER a FTP_PASSWORD (Settings → Secrets and variables → Actions).
# Režimy ručního spuštění:
#   probe   – jen vypíše složky na FTP (ověření přístupu a kořenové složky webu),
#   go-live – jednorázově přesune původní web do chráněné složky _puvodni-web/ a nahraje nový,
#   deploy  – nahraje jen změněné soubory (to samé dělá každý push do main).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | go-live | deploy'
        type: choice
        options: [deploy, probe, go-live]
        default: deploy
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
env:
  FTP_HOST: cistareseni.cz
  WEB_ROOT: /
  FTP_VERIFY: 'yes'
jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: List folders on the FTP server
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for verify in yes no; do
            echo "== FTPS, certificate verification: $verify"
            if lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "set ftp:ssl-force true; set ssl:verify-certificate $verify; set net:max-retries 1; set net:timeout 20; pwd; cls -1aF /; bye"; then
              echo "== works with certificate verification: $verify"; break
            fi
          done

  deploy:
    if: inputs.mode != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://www.cistareseni.cz/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media build dependencies
        run: python -m pip install Pillow==12.1.0 requests==2.32.5
      - uses: actions/cache@v4
        with:
          path: dist/assets/source
          key: source-media-${{ hashFiles('docs/source-inventory/content.json', 'scripts/restore_media.py') }}
      - name: Restore verified public media
        run: python scripts/restore_media.py
      - name: Check pages and local links
        run: python3 scripts/check_site.py
      - name: Production checks
        run: |
          test -f dist/.htaccess && test -f dist/sitemap.xml && test -f dist/robots.txt
          grep -q 'content="index, follow"' dist/index.html
          ! grep -rl 'majkpowa.github.io' dist --include=*.html
          # Stránka 404 se zobrazuje i na hlubších adresách: odkazy v ní se počítají od kořene webu.
          sed -i 's#<head>#<head><base href="/">#' dist/404.html
      - name: Move the previous website into a protected folder
        if: inputs.mode == 'go-live'
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          bash scripts/ftp_backup_old_site.sh
      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: ${{ env.FTP_VERIFY == 'yes' && 'strict' || 'loose' }}
          local-dir: dist/
          server-dir: ${{ env.WEB_ROOT }}
          timeout: 120000
      - name: Check the live website
        run: |
          sleep 5
          for path in "" en/ hu/ kontakt.html sluzby/servis-a-udrzba.html robots.txt sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.cistareseni.cz/$path")
            echo "$code /$path"; test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.cistareseni.cz/produkty-a-sluzby/servis-a-udrzba.html)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.cistareseni.cz/neexistuje.html)" = 404
          curl -s https://www.cistareseni.cz/ | grep -q 'hero-full'
