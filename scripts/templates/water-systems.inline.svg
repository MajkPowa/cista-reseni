<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none" style="stroke:none" role="img" aria-labelledby="ws-title ws-desc">
  <title id="ws-title">Dům, zahrada a tři systémy hospodaření s vodou</title>
  <desc id="ws-desc">Ilustrační izometrické schéma s průřezem zeminy. Dešťová voda ze střechy vede do akumulační nádrže, odpadní voda do domovní čistírny a čerpací šachta umožňuje přečerpání vody. Schéma nenahrazuje projekt konkrétní stavby.</desc>
